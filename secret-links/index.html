<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f4f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Notes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./logo.svg">
<title>Notes</title>
<style>
:root{
  --bg:#f4f4f4;--panel:#fff;--soft:#eeeeee;--text:#171717;--muted:#8a8a8a;
  --line:#e4e4e4;--shadow:0 8px 26px rgba(0,0,0,.05);--accent:#555;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer}
.shell{max-width:760px;margin:auto;padding:18px 16px 90px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}
.brand{display:flex;align-items:center;gap:11px;user-select:none;-webkit-user-select:none}
.brand img{width:42px;height:42px;border-radius:12px;display:block}
.brand strong{display:block;font-size:16px;letter-spacing:-.02em}
.brand span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.header-btn{border:0;background:transparent;color:#555;font-size:26px;line-height:1;width:40px;height:40px;border-radius:50%}
.header-btn:active{background:var(--soft)}
h1{font-size:38px;letter-spacing:-.055em;margin:0 0 16px}
.search{position:relative;margin-bottom:18px}
.search input{width:100%;border:0;background:#e9e9e9;border-radius:14px;padding:12px 14px 12px 40px;outline:none;color:var(--text)}
.search span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#8d8d8d}
.notes{display:grid;gap:10px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:15px 16px;box-shadow:var(--shadow)}
.note-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.note h3{margin:0;font-size:15px;letter-spacing:-.02em}
.note p{margin:7px 0 0;color:#656565;font-size:13px;line-height:1.55;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.note time{display:block;margin-top:11px;font-size:10px;color:#aaa}
.note-menu{border:0;background:transparent;color:#aaa;font-size:18px;padding:0 3px}
.empty{padding:42px 20px;text-align:center;color:var(--muted);font-size:13px}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));border:0;width:56px;height:56px;border-radius:50%;background:#555;color:#fff;font-size:28px;box-shadow:0 12px 28px rgba(0,0,0,.18)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.28);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}
.overlay.show{display:flex}
.sheet{width:min(100%,470px);max-height:90vh;overflow:auto;background:#fff;border-radius:24px;padding:20px;box-shadow:0 26px 80px rgba(0,0,0,.22)}
.sheet.wide{width:min(100%,760px)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.sheet-head h2{margin:0;font-size:20px;letter-spacing:-.04em}
.sheet-head p{margin:4px 0 0;color:#888;font-size:11px}
.close{border:0;background:#efefef;width:38px;height:38px;border-radius:12px;font-size:18px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:#777;font-weight:700;margin-bottom:7px}
.field input,.field textarea{width:100%;border:1px solid #e2e2e2;background:#fafafa;border-radius:13px;padding:12px 13px;outline:none}
.field textarea{min-height:150px;resize:vertical}
.primary{border:0;background:#555;color:#fff;border-radius:13px;padding:12px 16px;font-weight:700}
.secondary{border:1px solid #e0e0e0;background:#f3f3f3;color:#222;border-radius:12px;padding:10px 13px}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* hidden vault */
.vault-shell{background:#121212;color:#f5f5f5}
.vault-shell .sheet-head p,.vault-shell .muted{color:#8d8d8d}
.vault-shell .close{background:#252525;color:#eee}
.vault-add{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px}
.vault-add input,.vault-search input{width:100%;border:1px solid #2d2d2d;background:#1d1d1d;color:#f7f7f7;border-radius:13px;padding:12px 13px;outline:none}
.vault-add button{border:0;border-radius:13px;background:#e5e5e5;color:#111;padding:0 17px;font-weight:750}
.vault-search{margin-bottom:14px}
.link-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.link-card{background:#1c1c1c;border:1px solid #292929;border-radius:17px;padding:12px;display:grid;grid-template-columns:52px 1fr;gap:11px;align-items:center}
.link-logo{width:52px;height:52px;border-radius:13px;background:#2a2a2a;display:grid;place-items:center;overflow:hidden}
.link-logo img{width:36px;height:36px;object-fit:contain;border-radius:8px}
.link-meta{min-width:0}
.link-meta b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-meta span{display:block;color:#888;font-size:10px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-actions{grid-column:1/-1;display:flex;gap:6px}
.link-actions button{border:1px solid #303030;background:#242424;color:#ddd;border-radius:9px;padding:7px 9px;font-size:10px}
.vault-tools{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid #292929}
.vault-tools span{font-size:10px;color:#777}
.vault-tools button{border:1px solid #303030;background:#222;color:#ddd;border-radius:10px;padding:8px 10px;font-size:10px}
.secret-hint{font-size:10px;color:#666;margin-top:10px}

@media(max-width:560px){
  .shell{padding:15px 13px 86px}
  .overlay{align-items:flex-end;padding:0}
  .sheet{border-radius:24px 24px 0 0;max-height:93vh;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  .link-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<main class="shell">
  <header>
    <div class="brand" id="secretTrigger">
      <img src="./logo.svg" alt="F">
      <div><strong>Notes</strong><span>Personal notes</span></div>
    </div>
    <button class="header-btn" id="newNoteTop" aria-label="New note">＋</button>
  </header>

  <h1>Notes</h1>
  <div class="search">
    <span>⌕</span>
    <input id="noteSearch" placeholder="Search notes">
  </div>

  <section class="notes" id="notes"></section>
</main>

<button class="fab" id="newNoteFab" aria-label="New note">＋</button>

<div class="overlay" id="noteOverlay">
  <div class="sheet">
    <div class="sheet-head">
      <div><h2 id="noteSheetTitle">New note</h2><p>Write anything you want to remember.</p></div>
      <button class="close" data-close="noteOverlay">×</button>
    </div>
    <div class="field"><label>Title</label><input id="noteTitle" placeholder="Title"></div>
    <div class="field"><label>Note</label><textarea id="noteBody" placeholder="Start writing…"></textarea></div>
    <div class="row">
      <button class="primary" id="saveNote">Save note</button>
      <button class="secondary" id="deleteNoteBtn" style="display:none">Delete</button>
    </div>
  </div>
</div>

<div class="overlay" id="vaultOverlay">
  <div class="sheet wide vault-shell">
    <div class="sheet-head">
      <div><h2>Private Space</h2><p>Saved links</p></div>
      <button class="close" data-close="vaultOverlay">×</button>
    </div>

    <div class="vault-add">
      <input id="vaultUrl" inputmode="url" autocomplete="off" autocapitalize="off" placeholder="Paste link…">
      <button id="vaultAdd">Add</button>
    </div>

    <div class="vault-search"><input id="vaultSearch" placeholder="Search links"></div>
    <section class="link-grid" id="linkGrid"></section>

    <div class="vault-tools">
      <span id="linkCount">0 links</span>
      <div class="row">
        <button id="exportLinks">Export</button>
        <button id="clearLinks">Clear all</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="editLinkOverlay">
  <div class="sheet vault-shell">
    <div class="sheet-head">
      <div><h2>Edit link</h2><p>Change the title or URL.</p></div>
      <button class="close" data-close="editLinkOverlay">×</button>
    </div>
    <div class="field"><label>Title</label><input id="editLinkTitle"></div>
    <div class="field"><label>URL</label><input id="editLinkUrl" inputmode="url"></div>
    <div class="row">
      <button class="primary" id="saveLinkEdit">Save</button>
      <button class="secondary" id="deleteLinkEdit">Delete</button>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const NOTE_KEY='fnotes_v1';
const LINK_KEY='flinks_links_v3';
let noteEdit=-1, linkEdit=-1, pressTimer=null;

function getNotes(){try{return JSON.parse(localStorage.getItem(NOTE_KEY)||'[]')}catch{return[]}}
function setNotes(v){localStorage.setItem(NOTE_KEY,JSON.stringify(v));renderNotes()}
function getLinks(){try{return JSON.parse(localStorage.getItem(LINK_KEY)||'[]')}catch{return[]}}
function setLinks(v){localStorage.setItem(LINK_KEY,JSON.stringify(v));renderLinks()}
function open(id){$(id).classList.add('show')}
function close(id){$(id).classList.remove('show')}
function normalize(v){v=(v||'').trim();if(!v)return'';return /^https?:\/\//i.test(v)?v:'https://'+v}
function host(url){try{return new URL(normalize(url)).hostname.replace(/^www\./,'')}catch{return url}}
function titleFromUrl(url){const h=host(url).split('.')[0]||'Link';return h.charAt(0).toUpperCase()+h.slice(1)}
function favicon(url){return 'https://www.google.com/s2/favicons?sz=128&domain_url='+encodeURIComponent(normalize(url))}
function fmt(ts){return new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(ts))}

function renderNotes(){
  const q=$('noteSearch').value.trim().toLowerCase();
  const all=getNotes();
  const items=all.map((n,i)=>({...n,_i:i})).filter(n=>!q||(n.title||'').toLowerCase().includes(q)||(n.body||'').toLowerCase().includes(q));
  const box=$('notes');box.innerHTML='';
  if(!items.length){box.innerHTML='<div class="empty">'+(all.length?'No matching notes.':'No notes yet.')+'</div>';return}
  items.forEach(n=>{
    const card=document.createElement('article');card.className='note';
    const head=document.createElement('div');head.className='note-head';
    const title=document.createElement('h3');title.textContent=n.title||'Untitled';
    const menu=document.createElement('button');menu.className='note-menu';menu.textContent='•••';menu.onclick=()=>editNote(n._i);
    head.append(title,menu);
    const p=document.createElement('p');p.textContent=n.body||'';
    const t=document.createElement('time');t.textContent=fmt(n.updated||n.created||Date.now());
    card.append(head,p,t);card.onclick=e=>{if(e.target!==menu)editNote(n._i)};
    box.appendChild(card);
  });
}
function newNote(){noteEdit=-1;$('noteSheetTitle').textContent='New note';$('noteTitle').value='';$('noteBody').value='';$('deleteNoteBtn').style.display='none';open('noteOverlay');setTimeout(()=>$('noteTitle').focus(),80)}
function editNote(i){const n=getNotes()[i];if(!n)return;noteEdit=i;$('noteSheetTitle').textContent='Edit note';$('noteTitle').value=n.title||'';$('noteBody').value=n.body||'';$('deleteNoteBtn').style.display='inline-block';open('noteOverlay')}
function saveNote(){
  const title=$('noteTitle').value.trim(),body=$('noteBody').value.trim();
  if(!title&&!body){close('noteOverlay');return}
  const a=getNotes(),now=Date.now();
  if(noteEdit>=0)a[noteEdit]={...a[noteEdit],title,body,updated:now};
  else a.unshift({title,body,created:now,updated:now});
  setNotes(a);close('noteOverlay');
}
function deleteNote(){
  if(noteEdit<0)return;if(!confirm('Delete this note?'))return;
  const a=getNotes();a.splice(noteEdit,1);setNotes(a);close('noteOverlay');
}

function renderLinks(){
  const q=$('vaultSearch').value.trim().toLowerCase(),all=getLinks();
  $('linkCount').textContent=all.length+' '+(all.length===1?'link':'links');
  const items=all.map((x,i)=>({...x,_i:i})).filter(x=>!q||(x.name||'').toLowerCase().includes(q)||x.url.toLowerCase().includes(q));
  const box=$('linkGrid');box.innerHTML='';
  if(!items.length){box.innerHTML='<div class="empty" style="grid-column:1/-1;color:#777;border:1px dashed #303030;border-radius:16px">'+(all.length?'No matching links.':'No saved links yet.')+'</div>';return}
  items.forEach(x=>{
    const card=document.createElement('article');card.className='link-card';
    const logo=document.createElement('div');logo.className='link-logo';
    const img=document.createElement('img');img.src=favicon(x.url);img.alt='';img.onerror=()=>{img.src='./logo.svg'};logo.appendChild(img);
    const meta=document.createElement('div');meta.className='link-meta';
    const b=document.createElement('b');b.textContent=x.name||titleFromUrl(x.url);
    const s=document.createElement('span');s.textContent=host(x.url);meta.append(b,s);
    const acts=document.createElement('div');acts.className='link-actions';
    [['Open',()=>window.open(x.url,'_blank','noopener,noreferrer')],['Edit',()=>editLink(x._i)],['Delete',()=>deleteLink(x._i)]].forEach(([t,fn])=>{const bt=document.createElement('button');bt.textContent=t;bt.onclick=fn;acts.appendChild(bt)});
    card.append(logo,meta,acts);box.appendChild(card);
  });
}
function addLink(){
  const input=$('vaultUrl'),url=normalize(input.value);if(!url){input.focus();return}
  try{new URL(url)}catch{input.focus();return}
  const a=getLinks();a.unshift({url,name:titleFromUrl(url),thumb:''});setLinks(a);input.value='';input.focus();
}
function editLink(i){const x=getLinks()[i];if(!x)return;linkEdit=i;$('editLinkTitle').value=x.name||titleFromUrl(x.url);$('editLinkUrl').value=x.url;open('editLinkOverlay')}
function saveLinkEdit(){
  if(linkEdit<0)return;const url=normalize($('editLinkUrl').value);if(!url)return;
  const a=getLinks();a[linkEdit]={...a[linkEdit],url,name:$('editLinkTitle').value.trim()||titleFromUrl(url)};setLinks(a);close('editLinkOverlay');
}
function deleteLink(i){if(!confirm('Delete this link?'))return;const a=getLinks();a.splice(i,1);setLinks(a)}
function exportLinks(){const blob=new Blob([JSON.stringify(getLinks(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='links-backup.json';a.click();URL.revokeObjectURL(a.href)}

$('newNoteTop').onclick=newNote;$('newNoteFab').onclick=newNote;$('saveNote').onclick=saveNote;$('deleteNoteBtn').onclick=deleteNote;$('noteSearch').oninput=renderNotes;
$('vaultAdd').onclick=addLink;$('vaultUrl').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addLink()}});$('vaultSearch').oninput=renderLinks;
$('saveLinkEdit').onclick=saveLinkEdit;$('deleteLinkEdit').onclick=()=>{if(linkEdit>=0){deleteLink(linkEdit);close('editLinkOverlay')}};
$('exportLinks').onclick=exportLinks;$('clearLinks').onclick=()=>{if(confirm('Delete all saved links?'))setLinks([])};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close));
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)close(o.id)}));

/* secret access: long-press the F logo / Notes brand */
$('secretTrigger').addEventListener('pointerdown',()=>pressTimer=setTimeout(()=>{renderLinks();open('vaultOverlay')},1200));
['pointerup','pointerleave','pointercancel'].forEach(evt=>$('secretTrigger').addEventListener(evt,()=>clearTimeout(pressTimer)));

renderNotes();renderLinks();
</script>
</body>
</html>
